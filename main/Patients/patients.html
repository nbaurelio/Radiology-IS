<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Patients - Radiology IS</title>
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="patients.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<!-- Header will be injected here -->
<div id="header-container"></div>

<!-- Page content -->
<main class="container">
    <section class="grid">

        <!-- Search and Add Patient Bar -->
        <article class="card search-bar">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search patients by name, ID, or exam type..." />
            </div>
            <button class="add-patient-btn" id="addPatientBtn" aria-label="Add Patient">
                <span class="plus-icon">+</span>
            </button>
        </article>

        <!-- Patients List -->
        <article class="card table-card">
            <div class="hd">Patient Records (<span id="patientCount">0</span>)</div>
            <div class="bd">
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Sex</th>
                            <th>Next Appointment</th>
                            <th>Contact</th>
                        </tr>
                        </thead>
                        <tbody id="patientsTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 24px;">Loading patients...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </article>

    </section>
</main>


<!-- Load Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/header.js"></script>

<script>
    // Check if user is logged in
    const currentUser = authService.getCurrentUser();
    if (!currentUser) {
        window.location.href = '../Login/login.html';
    }

    // Initialize header with smooth animations
    headerComponent.initialize('patients');

    // Add patient button - navigate to add patient page
    const addBtn = document.getElementById('addPatientBtn');
    const searchInput = document.getElementById('searchInput');

    addBtn.addEventListener('click', () => {
        window.location.href = 'add-patient.html';
    });

    // Load patients
    async function loadPatients() {
        try {
            const result = await patientService.getAllPatients();
            if (result.success) {
                displayPatients(result.patients);
                document.getElementById('patientCount').textContent = result.patients.length;
            } else {
                document.getElementById('patientsTableBody').innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 24px; color: #ef4444;">
                            Error loading patients: ${result.message}
                        </td>
                    </tr>
                `;
            }
        } catch (error) {
            console.error('Error loading patients:', error);
            document.getElementById('patientsTableBody').innerHTML = `
                <tr>
                    <td colspan="5" style="text-align: center; padding: 24px; color: #ef4444;">
                        Error loading patients. Check console for details.
                    </td>
                </tr>
            `;
        }
    }

    function displayPatients(patients) {
        const tbody = document.getElementById('patientsTableBody');
        
        if (patients.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align: center; padding: 24px;">
                        No patients found. Click + to add a new patient.
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = patients.map(patient => {
            const fullName = `${patient.first_name || ''} ${patient.last_name || ''}`.trim() || patient.name || 'Unknown';
            
            // Better contact display
            let contactDisplay = '';
            if (patient.phone && patient.email) {
                contactDisplay = `${patient.phone}<br><small style="color: var(--muted);">${patient.email}</small>`;
            } else if (patient.phone) {
                contactDisplay = patient.phone;
            } else if (patient.email) {
                contactDisplay = patient.email;
            } else {
                contactDisplay = 'N/A';
            }
            
            // Format next appointment
            let appointmentDisplay = '';
            if (patient.next_appointment) {
                // Format timestamp as "YYYY-MM-DD HH:MM AM/PM"
                const date = new Date(patient.next_appointment);
                const dateStr = date.toLocaleDateString('en-CA'); // YYYY-MM-DD format
                let hours = date.getHours();
                const minutes = date.getMinutes().toString().padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12; // Convert to 12-hour format
                appointmentDisplay = `${dateStr} ${hours}:${minutes} ${ampm}`;
            } else {
                appointmentDisplay = '<span class="badge badge-no-appointment">No Appointment</span>';
            }
            
            return `
                <tr onclick="window.location.href='patient-detail.html?id=${patient.id}'">
                    <td data-label="Patient ID">${patient.patient_id || 'N/A'}</td>
                    <td data-label="Name">${fullName}</td>
                    <td data-label="Sex">${(patient.sex || 'N/A').charAt(0).toUpperCase() + (patient.sex || 'N/A').slice(1)}</td>
                    <td data-label="Next Appointment">${appointmentDisplay}</td>
                    <td data-label="Contact">${contactDisplay}</td>
                </tr>
            `;
        }).join('');
    }

    // Search functionality
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
            const searchTerm = e.target.value.trim();
            if (searchTerm) {
                const result = await patientService.searchPatients(searchTerm);
                if (result.success) {
                    displayPatients(result.patients);
                    document.getElementById('patientCount').textContent = result.patients.length;
                }
            } else {
                loadPatients();
            }
        }, 300);
    });


    // Load patients on page load
    loadPatients();
</script>

<script src="../shared/theme-toggle.js"></script>
</body>
</html>
