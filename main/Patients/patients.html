<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Patients - Radiology IS</title>
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="patients.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<!-- Top navbar -->
<header class="topnav">
    <div class="row">
        <div class="brand">
            <span class="logo"></span>
            <div>
                Radiology IS
                <small>Patients</small>
            </div>
        </div>
        <div class="spacer"></div>
        <div class="actions">
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            <button class="btn">Settings</button>
            <button class="btn" id="logoutBtn">Logout</button>
            <div class="avatar" href="#" aria-label="Profile"></div>
        </div>
    </div>

    <!-- Tabs -->
    <nav class="tabs" aria-label="Primary">
        <a class="tab" href="../Dashboard/dashboard.html">Dashboard</a>
        <a class="tab" href="#">Upload DICOM</a>
        <a class="tab" href="#">Reports</a>
        <a class="tab" href="#">Telehealth</a>
        <a class="tab active" href="patients.html">Patients</a>
    </nav>
</header>

<!-- Page content -->
<main class="container">
    <section class="grid">

        <!-- Search and Add Patient Bar -->
        <article class="card search-bar">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search patients by name, ID, or exam type..." />
            </div>
            <button class="add-patient-btn" id="addPatientBtn" aria-label="Add Patient">
                <span class="plus-icon">+</span>
            </button>
        </article>

        <!-- Patients List -->
        <article class="card table-card">
            <div class="hd">Patient Records (<span id="patientCount">0</span>)</div>
            <div class="bd">
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Sex</th>
                            <th>Date of Birth</th>
                            <th>Contact</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="patientsTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 24px;">Loading patients...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </article>

    </section>
</main>

<!-- Add Patient Modal -->
<div class="modal" id="addPatientModal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h2>Personal info</h2>
                <p class="modal-subtitle">Basic info about the patient</p>
            </div>
            <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="patientForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="material-icons input-icon">person</span>
                            <input type="text" id="firstName" class="form-input" placeholder="Ex: John" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="material-icons input-icon">person</span>
                            <input type="text" id="lastName" class="form-input" placeholder="Ex: Doe" required />
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="patientId">Patient ID <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="material-icons input-icon">badge</span>
                            <input type="text" id="patientId" class="form-input" placeholder="Ex: PAT-004" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="contactEmail">Contact Email</label>
                        <div class="input-with-icon">
                            <span class="material-icons input-icon">email</span>
                            <input type="email" id="contactEmail" class="form-input" placeholder="Ex: patient@email.com" />
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="material-icons input-icon">phone</span>
                            <input type="tel" id="phoneNumber" class="form-input" placeholder="Ex: +1 555 123 4567" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="patientSex">Sex <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="material-icons input-icon">wc</span>
                            <select id="patientSex" class="form-input" required>
                                <option value="">Select sex</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dateOfBirth">Date of Birth</label>
                        <div class="input-with-icon">
                            <span class="material-icons input-icon">cake</span>
                            <input type="date" id="dateOfBirth" class="form-input" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <div class="input-with-icon">
                            <span class="material-icons input-icon">home</span>
                            <input type="text" id="address" class="form-input" placeholder="Ex: 123 Main St" />
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-create" id="submitBtn">Create Profile</button>
            </form>
        </div>
    </div>
</div>

<!-- Load Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-config.js"></script>

<script>
    // Check if user is logged in
    const currentUser = authService.getCurrentUser();
    if (!currentUser) {
        window.location.href = '../Login/login.html';
    }

    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
        if (confirm('Are you sure you want to logout?')) {
            authService.logout();
        }
    });

    // Modal functionality
    const modal = document.getElementById('addPatientModal');
    const addBtn = document.getElementById('addPatientBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const form = document.getElementById('patientForm');
    const searchInput = document.getElementById('searchInput');

    // Open modal
    addBtn.addEventListener('click', () => {
        modal.style.display = 'flex';
        form.reset();
    });

    // Close modal
    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    // Close modal when clicking outside
    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });

    // Load patients
    async function loadPatients() {
        try {
            const result = await patientService.getAllPatients();
            if (result.success) {
                displayPatients(result.patients);
                document.getElementById('patientCount').textContent = result.patients.length;
            } else {
                document.getElementById('patientsTableBody').innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 24px; color: #ef4444;">
                            Error loading patients: ${result.message}
                        </td>
                    </tr>
                `;
            }
        } catch (error) {
            console.error('Error loading patients:', error);
            document.getElementById('patientsTableBody').innerHTML = `
                <tr>
                    <td colspan="6" style="text-align: center; padding: 24px; color: #ef4444;">
                        Error loading patients. Check console for details.
                    </td>
                </tr>
            `;
        }
    }

    function displayPatients(patients) {
        const tbody = document.getElementById('patientsTableBody');
        
        if (patients.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align: center; padding: 24px;">
                        No patients found. Click + to add a new patient.
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = patients.map(patient => {
            const fullName = `${patient.first_name || ''} ${patient.last_name || ''}`.trim() || patient.name || 'Unknown';
            
            // Format date consistently
            const dob = patient.date_of_birth 
                ? new Date(patient.date_of_birth).toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit' 
                  })
                : 'N/A';
            
            // Better contact display
            let contactDisplay = '';
            if (patient.phone && patient.email) {
                contactDisplay = `${patient.phone}<br><small style="color: var(--muted);">${patient.email}</small>`;
            } else if (patient.phone) {
                contactDisplay = patient.phone;
            } else if (patient.email) {
                contactDisplay = patient.email;
            } else {
                contactDisplay = 'N/A';
            }
            
            return `
                <tr>
                    <td data-label="Patient ID">${patient.patient_id || 'N/A'}</td>
                    <td data-label="Name">${fullName}</td>
                    <td data-label="Sex">${(patient.sex || 'N/A').charAt(0).toUpperCase() + (patient.sex || 'N/A').slice(1)}</td>
                    <td data-label="Date of Birth">${dob}</td>
                    <td data-label="Contact">${contactDisplay}</td>
                    <td data-label="Actions">
                        <a href="patient-detail.html?id=${patient.id}" class="btn-grad">View</a>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // Search functionality
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
            const searchTerm = e.target.value.trim();
            if (searchTerm) {
                const result = await patientService.searchPatients(searchTerm);
                if (result.success) {
                    displayPatients(result.patients);
                    document.getElementById('patientCount').textContent = result.patients.length;
                }
            } else {
                loadPatients();
            }
        }, 300);
    });

    // Handle form submission
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.textContent = 'Creating...';
        submitBtn.disabled = true;
        
        const patientData = {
            patient_id: document.getElementById('patientId').value.trim(),
            first_name: document.getElementById('firstName').value.trim(),
            last_name: document.getElementById('lastName').value.trim(),
            email: document.getElementById('contactEmail').value.trim() || null,
            phone: document.getElementById('phoneNumber').value.trim(),
            sex: document.getElementById('patientSex').value,
            date_of_birth: document.getElementById('dateOfBirth').value || null,
            address: document.getElementById('address').value.trim() || null,
            name: `${document.getElementById('firstName').value.trim()} ${document.getElementById('lastName').value.trim()}`
        };
        
        try {
            const result = await patientService.createPatient(patientData);
            
            if (result.success) {
                alert(`Patient profile created successfully!\n\nPatient ID: ${patientData.patient_id}\nName: ${patientData.first_name} ${patientData.last_name}`);
                form.reset();
                modal.style.display = 'none';
                loadPatients();
            } else {
                alert(`Error creating patient: ${result.message}`);
            }
        } catch (error) {
            console.error('Error creating patient:', error);
            alert('An error occurred. Please try again.');
        } finally {
            submitBtn.textContent = 'Create Profile';
            submitBtn.disabled = false;
        }
    });

    // Load patients on page load
    loadPatients();
</script>

<script src="../shared/theme-toggle.js"></script>
</body>
</html>
