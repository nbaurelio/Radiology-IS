<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Patients - Radiology IS</title>
    <link rel="stylesheet" href="patients.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Top navbar -->
<header class="topnav">
    <div class="row">
        <div class="brand">
            <span class="logo"></span>
            <div>
                Radiology IS
                <small>Patients</small>
            </div>
        </div>
        <div class="spacer"></div>
        <div class="actions">
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            <button class="btn">Settings</button>
            <a href="../Login/login.html" class="btn btn-login-nav">Login</a>
            <a class="avatar" href="#" aria-label="Profile"></a>
        </div>
    </div>

    <!-- Tabs -->
    <nav class="tabs" aria-label="Primary">
        <a class="tab" href="../Dashboard/dashboard.html">Dashboard</a>
        <a class="tab" href="#">Upload DICOM</a>
        <a class="tab" href="#">Reports</a>
        <a class="tab" href="#">Telehealth</a>
        <a class="tab active" href="patients.html">Patients</a>
    </nav>
</header>

<!-- Page content -->
<main class="container">
    <section class="grid">

        <!-- Search and Add Patient Bar -->
        <article class="card search-bar">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search patients by name or ID..." />
            </div>
            <button class="add-patient-btn" id="addPatientBtn" aria-label="Add Patient">
                <span class="plus-icon">+</span>
            </button>
        </article>

        <!-- Patients Table -->
        <article class="card table-card">
            <div class="hd">
                <span>All Patients</span>
                <span class="patient-count" id="patientCount">Loading...</span>
            </div>
            <div class="bd">
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Sex</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="patientsTableBody">
                        <tr>
                            <td colspan="5" style="text-align:center; padding:40px; color:var(--muted);">
                                <div style="font-size:48px; margin-bottom:16px;">📋</div>
                                Loading patients...
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </article>

    </section>
</main>

<!-- Add Patient Modal -->
<div class="modal" id="addPatientModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Create Patient Profile</h2>
            <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="patientForm">
                <div class="form-group">
                    <label for="patientName">Patient Name *</label>
                    <input type="text" id="patientName" class="form-input" placeholder="Enter full name" required />
                </div>
                <div class="form-group">
                    <label for="patientId">Patient ID *</label>
                    <input type="text" id="patientId" class="form-input" placeholder="Enter patient ID" required />
                </div>
                <div class="form-group">
                    <label for="patientSex">Sex *</label>
                    <select id="patientSex" class="form-input" required>
                        <option value="">Select sex</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="patientDob">Date of Birth</label>
                    <input type="date" id="patientDob" class="form-input" />
                </div>
                <div class="form-group">
                    <label for="patientEmail">Email</label>
                    <input type="email" id="patientEmail" class="form-input" placeholder="patient@example.com" />
                </div>
                <div class="form-group">
                    <label for="patientPhone">Phone</label>
                    <input type="tel" id="patientPhone" class="form-input" placeholder="+63 XXX XXX XXXX" />
                </div>
                <button type="submit" class="btn-create">Create Profile</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-config.js"></script>
<script src="patients-supabase.js"></script>
<script src="../shared/theme-toggle.js"></script>
</body>
</html>
