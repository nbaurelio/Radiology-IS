<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Radiology IS</title>
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<button id="themeToggle" class="theme-toggle-login" aria-label="Toggle theme">🌙</button>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-large"></div>
            <h1>Radiology IS</h1>
            <p class="subtitle">Sign in to your account</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="userId">User ID</label>
                <input 
                    type="text" 
                    id="userId" 
                    class="form-input" 
                    placeholder="Enter your user ID" 
                    required 
                    value="ADMIN001"
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Enter your password" 
                    required 
                    value="admin123"
                />
            </div>

            <button type="submit" class="btn-login">Login</button>
            
            <div id="errorMessage" style="color: #ef4444; text-align: center; margin-top: 12px; font-size: 14px; display: none;"></div>
        </form>

        <div class="login-footer">
            <p class="muted">Superuser access only</p>
            <p class="muted" style="margin-top: 8px; font-size: 12px;">
                Test users:<br>
                Admin: ADMIN001 / admin123<br>
                Radiologist: RAD001 / admin123<br>
                Rad Tech: TECH001 / admin123
            </p>
        </div>
    </div>
</div>

<!-- Load Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-config.js"></script>

<script>
    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const userId = document.getElementById('userId').value.trim();
        const password = document.getElementById('password').value;
        const btn = form.querySelector('.btn-login');
        
        // Reset error message
        errorMessage.style.display = 'none';
        
        // Show loading state
        btn.textContent = 'Logging in...';
        btn.disabled = true;
        
        try {
            // Call login function from supabase-config.js
            const result = await authService.login(userId, password);
            
            if (result.success) {
                // Success! Redirect to dashboard
                window.location.href = '../Dashboard/dashboard.html';
            } else {
                // Show error message
                errorMessage.textContent = result.message || 'Invalid credentials. Please try again.';
                errorMessage.style.display = 'block';
                btn.textContent = 'Login';
                btn.disabled = false;
            }
        } catch (error) {
            console.error('Login error:', error);
            errorMessage.textContent = 'An error occurred. Please try again.';
            errorMessage.style.display = 'block';
            btn.textContent = 'Login';
            btn.disabled = false;
        }
    });
</script>

<script src="../shared/theme-toggle.js"></script>
</body>
</html>
