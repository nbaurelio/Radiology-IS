<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Radiology IS</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<button id="themeToggle" class="theme-toggle-login" aria-label="Toggle theme">🌙</button>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-large"></div>
            <h1>Radiology IS</h1>
            <p class="subtitle">Sign in to your account</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-input" 
                    placeholder="Enter your email" 
                    required 
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Enter your password" 
                    required 
                />
            </div>

            <div id="errorMessage" class="error-message" style="display:none;"></div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="login-footer">
            <p class="muted">Superuser access only</p>
        </div>
    </div>
</div>

<script src="../shared/theme-toggle.js"></script>
<script src="../shared/supabase-config.js"></script>
<script>
    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = form.querySelector('.btn-login');
        
        // Show loading state
        btn.textContent = 'Logging in...';
        btn.disabled = true;
        errorMessage.style.display = 'none';
        
        try {
            // Sign in with Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });
            
            if (error) throw error;
            
            // Success! Redirect to dashboard
            console.log('Login successful:', data);
            window.location.href = '../Dashboard/dashboard.html';
            
        } catch (error) {
            console.error('Login error:', error);
            errorMessage.textContent = error.message || 'Login failed. Please check your credentials.';
            errorMessage.style.display = 'block';
            btn.textContent = 'Login';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
