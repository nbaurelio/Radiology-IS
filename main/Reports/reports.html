<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reports - Radiology IS</title>
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="reports.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<!-- Header will be injected here -->
<div id="header-container"></div>

<!-- Page content -->
<main class="container">
    <section class="grid">

        <!-- Search and Add Report Bar -->
        <article class="card search-bar">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search reports by patient, study, or radiologist..." />
            </div>
            <a href="add-report.html" class="add-patient-btn" aria-label="Add Report" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                <span class="plus-icon">+</span>
            </a>
        </article>

        <!-- Reports List -->
        <article class="card table-card">
            <div class="hd">Radiology Reports (<span id="reportCount">0</span>)</div>
            <div class="bd">
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>Study ID</th>
                            <th>Patient</th>
                            <th>Exam Type</th>
                            <th>Appointment Date</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Notes</th>
                        </tr>
                        </thead>
                        <tbody id="reportsTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 24px;">Loading reports...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </article>

    </section>
</main>

<!-- Load Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/header.js"></script>

<script>
    // Check if user is logged in
    const currentUser = authService.getCurrentUser();
    if (!currentUser) {
        window.location.href = '../Login/login.html';
    }

    // Initialize header with smooth animations
    headerComponent.initialize('reports');

    const searchInput = document.getElementById('searchInput');

    // Load reports
    async function loadReports() {
        const tbody = document.getElementById('reportsTableBody');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 24px;">Loading reports...</td></tr>';

        try {
            const result = await reportService.getAllReports();
            
            if (result.success && result.reports && result.reports.length > 0) {
                displayReports(result.reports);
                document.getElementById('reportCount').textContent = result.reports.length;
            } else {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 24px;">
                            No reports found. Click + to add a new report.
                        </td>
                    </tr>
                `;
                document.getElementById('reportCount').textContent = '0';
            }
        } catch (error) {
            console.error('Error loading reports:', error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align: center; padding: 24px; color: #ef4444;">
                        Error loading reports. Check console for details.
                    </td>
                </tr>
            `;
        }
    }

    // Display reports in table
    function displayReports(reports) {
        const tbody = document.getElementById('reportsTableBody');
        
        if (!reports || reports.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" style="text-align: center; padding: 24px;">
                        No reports found. Click + to add a new report.
                    </td>
                </tr>
            `;
            return;
        }
        
        tbody.innerHTML = reports.map(report => {
            // Get patient name from joined patients table or from name field
            const patientName = report.patients ? 
                `${report.patients.first_name} ${report.patients.last_name}` : 
                (report.name || 'Unknown Patient');
            
            // Get study ID
            const studyId = report.study_id || 'N/A';
            
            const statusClass = report.status === 'pending' ? 'badge-pending' :
                               report.status === 'completed' ? 'badge-done' : 'badge-reading';
            
            // Format status: capitalize first letter only
            const statusText = (report.status || 'pending').charAt(0).toUpperCase() + (report.status || 'pending').slice(1).toLowerCase();

            // Priority badge
            const priority = report.priority || 'routine';
            const priorityClass = priority === 'stat' ? 'badge-priority-stat' : 
                                 priority === 'urgent' ? 'badge-priority-urgent' : 'badge-priority-routine';
            const priorityText = priority === 'stat' ? 'STAT' : 
                                priority.charAt(0).toUpperCase() + priority.slice(1);

            // Format study date or schedule
            let dateStr = 'N/A';
            const dateToUse = report.study_date || report.schedule;
            if (dateToUse) {
                const date = new Date(dateToUse);
                const datePart = date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                const timePart = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                dateStr = `${datePart} ${timePart}`;
            }

            return `
                <tr onclick="window.location.href='report-detail.html?id=${report.id}'" style="cursor: pointer;">
                    <td data-label="Study ID">${studyId}</td>
                    <td data-label="Patient">${patientName}</td>
                    <td data-label="Exam Type">${report.exam_type || 'N/A'}</td>
                    <td data-label="Appointment Date">${dateStr}</td>
                    <td data-label="Priority">
                        <span class="badge ${priorityClass}">${priorityText}</span>
                    </td>
                    <td data-label="Status">
                        <span class="badge ${statusClass}">${statusText}</span>
                    </td>
                    <td data-label="Notes">${report.notes || '-'}</td>
                </tr>
            `;
        }).join('');
    }

    // Search functionality
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
            const searchTerm = e.target.value.trim();
            if (searchTerm) {
                const result = await reportService.searchReports(searchTerm);
                if (result.success) {
                    displayReports(result.reports);
                    document.getElementById('reportCount').textContent = result.reports.length;
                }
            } else {
                loadReports();
            }
        }, 300);
    });

    // Load reports on page load
    loadReports();
</script>

<script src="../shared/theme-toggle.js"></script>
</body>
</html>
